<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Fietsrace</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b1b1b; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  body { display: flex; align-items: center; justify-content: center; font-family: "Arial Black", Arial, sans-serif; }
  canvas { display: block; background: #4caf50; box-shadow: 0 0 40px #000; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
const W = 400, H = 700;
const ROAD_L = 70, ROAD_R = 330;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

function resize() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  const dpr = devicePixelRatio || 1;
  cv.style.width = W * s + 'px';
  cv.style.height = H * s + 'px';
  cv.width = W * s * dpr;
  cv.height = H * s * dpr;
  ctx.setTransform(s * dpr, 0, 0, s * dpr, 0, 0);
}
addEventListener('resize', resize);
resize();

// ---------- geluid ----------
let ac = null;
function beep(freq, dur, type = 'square', vol = 0.08, slide = 0) {
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = freq;
    if (slide) o.frequency.linearRampToValueAtTime(freq + slide, ac.currentTime + dur);
    g.gain.value = vol;
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime + dur);
  } catch (e) {}
}
const sfx = {
  coin: () => { beep(988, 0.08); setTimeout(() => beep(1319, 0.12), 70); },
  hit: () => beep(160, 0.35, 'sawtooth', 0.12, -100),
  splash: () => beep(400, 0.25, 'triangle', 0.1, -300),
  boost: () => beep(500, 0.4, 'square', 0.07, 700),
  bell: () => { beep(1800, 0.15, 'sine', 0.1); setTimeout(() => beep(1800, 0.2, 'sine', 0.1), 160); },
  over: () => { beep(400, 0.2); setTimeout(() => beep(300, 0.2), 200); setTimeout(() => beep(200, 0.5), 400); },
};

// ---------- opslag ----------
function loadBest() { try { return +localStorage.getItem('fietsrace-best') || 0; } catch (e) { return 0; } }
function saveBest(v) { try { localStorage.setItem('fietsrace-best', v); } catch (e) {} }

// ---------- toestand ----------
let state = 'menu'; // menu | play | over
let best = loadBest();
let p, objs, scenery, speed, dist, coins, lives, invul, slow, boost, spawnIn, sceneIn, roadOff, shake, popups, newBest;

function reset() {
  p = { x: W / 2, y: H - 130, vx: 0, tilt: 0, pedal: 0 };
  objs = []; scenery = []; popups = [];
  speed = 280; dist = 0; coins = 0; lives = 3;
  invul = 0; slow = 0; boost = 0; spawnIn = 1; sceneIn = 0; roadOff = 0; shake = 0; newBest = false;
  for (let y = 0; y < H; y += 90) addScenery(y);
}

// ---------- besturing ----------
const keys = {};
let touchX = null;
addEventListener('keydown', e => {
  keys[e.key] = true;
  if ((e.key === ' ' || e.key === 'Enter') && state !== 'play') start();
  if (e.key === 'b' && state === 'play') sfx.bell();
});
addEventListener('keyup', e => { keys[e.key] = false; });
function toGame(e) {
  const r = cv.getBoundingClientRect();
  return (e.clientX - r.left) / r.width * W;
}
cv.addEventListener('pointerdown', e => {
  if (state !== 'play') { if (performance.now() - overAt > 600) start(); return; }
  touchX = toGame(e);
});
cv.addEventListener('pointermove', e => { if (touchX !== null) touchX = toGame(e); });
addEventListener('pointerup', () => { touchX = null; });
addEventListener('pointercancel', () => { touchX = null; });

let overAt = 0;
function start() { reset(); state = 'play'; sfx.bell(); }

// ---------- objecten ----------
const CAR_COLORS = ['#e53935', '#1e88e5', '#fdd835', '#8e24aa', '#fafafa', '#43a047', '#fb8c00'];
function rnd(a, b) { return a + Math.random() * (b - a); }
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }

function spawn() {
  const d = dist / 10;
  const r = Math.random();
  const x = rnd(ROAD_L + 30, ROAD_R - 30);
  if (r < 0.22) objs.push({ t: 'car', x, y: -100, w: 46, h: 84, vy: rnd(60, 140), col: pick(CAR_COLORS) });
  else if (r < 0.34) objs.push({ t: 'hole', x, y: -40, w: 34, h: 26 });
  else if (r < 0.46) objs.push({ t: 'puddle', x, y: -40, w: 60, h: 34 });
  else if (r < 0.56) objs.push({ t: 'cone', x, y: -30, w: 22, h: 24 });
  else if (r < 0.64 && d > 150) {
    const fromLeft = Math.random() < 0.5;
    objs.push({ t: 'dog', x: fromLeft ? ROAD_L - 20 : ROAD_R + 20, y: -30, w: 34, h: 20, vx: (fromLeft ? 1 : -1) * rnd(70, 120) });
  }
  else if (r < 0.72 && d > 80) objs.push({ t: 'bike', x, y: -50, w: 20, h: 44, vy: rnd(90, 150), col: pick(CAR_COLORS), wob: rnd(0, 6) });
  else if (r < 0.76) objs.push({ t: 'bottle', x, y: -30, w: 22, h: 30 });
  else {
    // rij muntjes
    const n = 3 + Math.floor(Math.random() * 3);
    for (let i = 0; i < n; i++) objs.push({ t: 'coin', x, y: -30 - i * 40, w: 22, h: 22 });
  }
}

function addScenery(y) {
  for (const side of [0, 1]) {
    const r = Math.random();
    const x = side ? rnd(ROAD_R + 22, W - 20) : rnd(20, ROAD_L - 22);
    if (r < 0.45) scenery.push({ t: 'tree', x, y: y + rnd(-20, 20), s: rnd(0.8, 1.2) });
    else if (r < 0.65) scenery.push({ t: 'house', x: side ? W - 30 : 30, y, col: pick(['#c0392b', '#d35400', '#8d6e63', '#a1887f']), side });
    else if (r < 0.75) scenery.push({ t: 'cow', x, y, side });
    else if (r < 0.82) scenery.push({ t: 'fan', x, y, col: pick(CAR_COLORS) });
  }
}

function hit(o) {
  if (invul > 0 || boost > 0) return false;
  lives--; invul = 1.6; shake = 0.35; sfx.hit();
  popups.push({ x: p.x, y: p.y - 40, txt: 'AU!', col: '#ff5252', t: 0 });
  if (navigator.vibrate) try { navigator.vibrate(150); } catch (e) {}
  if (lives <= 0) gameOver();
  return true;
}

function gameOver() {
  state = 'over'; overAt = performance.now(); sfx.over();
  const score = finalScore();
  if (score > best) { best = score; saveBest(best); newBest = true; }
}
function finalScore() { return Math.floor(dist / 10) + coins * 10; }

// ---------- update ----------
function update(dt) {
  if (state !== 'play') { roadOff = (roadOff + 60 * dt) % 60; return; }

  // snelheid stijgt langzaam
  const base = Math.min(280 + dist / 25, 720);
  let target = base;
  if (slow > 0) target *= 0.5;
  if (boost > 0) target *= 1.45;
  speed += (target - speed) * Math.min(1, dt * 3);
  dist += speed * dt;

  invul = Math.max(0, invul - dt);
  slow = Math.max(0, slow - dt);
  boost = Math.max(0, boost - dt);
  shake = Math.max(0, shake - dt);

  // speler bewegen
  const acc = 1700;
  let dir = 0;
  if (keys.ArrowLeft || keys.a || keys.q) dir -= 1;
  if (keys.ArrowRight || keys.d) dir += 1;
  if (touchX !== null) {
    const diff = touchX - p.x;
    p.vx = Math.max(-420, Math.min(420, diff * 8));
  } else if (dir) {
    p.vx += dir * acc * dt;
    p.vx = Math.max(-360, Math.min(360, p.vx));
  } else {
    p.vx *= Math.pow(0.002, dt);
  }
  p.x += p.vx * dt;
  if (p.x < ROAD_L + 12) { p.x = ROAD_L + 12; p.vx = 0; }
  if (p.x > ROAD_R - 12) { p.x = ROAD_R - 12; p.vx = 0; }
  p.tilt = p.vx / 360 * 0.35;
  p.pedal += speed * dt * 0.05;

  roadOff = (roadOff + speed * dt) % 60;

  // spawnen
  spawnIn -= speed * dt;
  if (spawnIn <= 0) {
    spawn();
    const gap = Math.max(110, 260 - dist / 60);
    spawnIn = rnd(gap * 0.7, gap * 1.3);
  }
  sceneIn -= speed * dt;
  if (sceneIn <= 0) { addScenery(-60); sceneIn = rnd(70, 120); }

  for (const s of scenery) s.y += speed * dt;
  scenery = scenery.filter(s => s.y < H + 80);

  for (const o of objs) {
    o.y += (speed - (o.vy || 0)) * dt;
    if (o.t === 'dog') { o.x += o.vx * dt; o.legs = (o.legs || 0) + dt * 14; }
    if (o.t === 'bike') { o.wob += dt * 3; o.x += Math.sin(o.wob) * 20 * dt; }
    if (o.t === 'coin') o.spin = (o.spin || 0) + dt * 6;

    if (!o.done && Math.abs(o.x - p.x) < (o.w / 2 + 9) && Math.abs(o.y - p.y) < (o.h / 2 + 20)) {
      if (o.t === 'coin') { o.done = true; coins++; sfx.coin(); popups.push({ x: o.x, y: o.y, txt: '+10', col: '#ffd54f', t: 0 }); }
      else if (o.t === 'bottle') { o.done = true; boost = 3; sfx.boost(); popups.push({ x: o.x, y: o.y, txt: 'TURBO!', col: '#4fc3f7', t: 0 }); }
      else if (o.t === 'puddle') { if (!slow && !boost) { slow = 1.2; sfx.splash(); popups.push({ x: p.x, y: p.y - 40, txt: 'PLETS!', col: '#90caf9', t: 0 }); } o.done = true; }
      else if (hit(o)) o.done = o.t !== 'car';
      else if (boost > 0 && o.t !== 'car') { o.done = true; o.flung = 1; }
    }
  }
  objs = objs.filter(o => o.y < H + 120 && o.y > -400 && !(o.done && (o.t === 'coin' || o.t === 'bottle' || o.t === 'cone' && !o.flung)));

  for (const q of popups) { q.t += dt; q.y -= 40 * dt; }
  popups = popups.filter(q => q.t < 0.9);
}

// ---------- tekenen ----------
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

function drawRoad() {
  // gras
  ctx.fillStyle = '#5cb85c'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#54ab54';
  for (let y = -60 + roadOff; y < H; y += 60) { ctx.fillRect(0, y, ROAD_L - 12, 30); ctx.fillRect(ROAD_R + 12, y, W - ROAD_R, 30); }
  // stoeprand
  ctx.fillStyle = '#ddd'; ctx.fillRect(ROAD_L - 10, 0, 10, H); ctx.fillRect(ROAD_R, 0, 10, H);
  // weg
  ctx.fillStyle = '#555'; ctx.fillRect(ROAD_L, 0, ROAD_R - ROAD_L, H);
  // fietspad-strepen
  ctx.fillStyle = '#c62828'; ctx.globalAlpha = 0.35;
  ctx.fillRect(ROAD_L, 0, 40, H); ctx.fillRect(ROAD_R - 40, 0, 40, H);
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#fff';
  for (let y = -60 + roadOff; y < H; y += 60) {
    ctx.fillRect(W / 2 - 3, y, 6, 32);
    ctx.fillRect(ROAD_L + 40, y, 3, 20); ctx.fillRect(ROAD_R - 43, y, 3, 20);
  }
}

function drawScenery(s) {
  ctx.save(); ctx.translate(s.x, s.y);
  if (s.t === 'tree') {
    ctx.scale(s.s, s.s);
    ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.beginPath(); ctx.arc(5, 6, 22, 0, 7); ctx.fill();
    ctx.fillStyle = '#2e7d32'; ctx.beginPath(); ctx.arc(0, 0, 22, 0, 7); ctx.fill();
    ctx.fillStyle = '#388e3c'; ctx.beginPath(); ctx.arc(-6, -6, 12, 0, 7); ctx.fill();
  } else if (s.t === 'house') {
    ctx.fillStyle = s.col; ctx.fillRect(-26, -30, 52, 60);
    ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(-26, -2, 52, 4);
    ctx.fillStyle = '#ffeb3b'; ctx.fillRect(-16, -22, 10, 10); ctx.fillRect(6, 12, 10, 10);
  } else if (s.t === 'cow') {
    ctx.fillStyle = '#fff'; rr(-14, -8, 28, 16, 6); ctx.fill();
    ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(-4, -1, 4, 0, 7); ctx.arc(7, 3, 3, 0, 7); ctx.fill();
    ctx.fillStyle = '#f8bbd0'; ctx.fillRect(s.side ? -20 : 14, -4, 6, 8);
  } else if (s.t === 'fan') {
    // supporter met vlag
    ctx.fillStyle = s.col; ctx.beginPath(); ctx.arc(0, 0, 8, 0, 7); ctx.fill();
    ctx.fillStyle = '#ffcc80'; ctx.beginPath(); ctx.arc(0, 0, 5, 0, 7); ctx.fill();
    const wave = Math.sin(performance.now() / 150 + s.x) * 4;
    ctx.fillStyle = '#000'; ctx.fillRect(8, -18 + wave, 5, 10);
    ctx.fillStyle = '#fdd835'; ctx.fillRect(13, -18 + wave, 5, 10);
    ctx.fillStyle = '#e53935'; ctx.fillRect(18, -18 + wave, 5, 10);
  }
  ctx.restore();
}

function drawObj(o) {
  ctx.save(); ctx.translate(o.x, o.y);
  if (o.t === 'car') {
    ctx.fillStyle = 'rgba(0,0,0,.25)'; rr(-21, -38, 46, 84, 10); ctx.fill();
    ctx.fillStyle = o.col; rr(-23, -42, 46, 84, 10); ctx.fill();
    ctx.fillStyle = '#263238'; rr(-17, -26, 34, 16, 4); ctx.fill(); rr(-17, 16, 34, 12, 4); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.25)'; rr(-15, -8, 30, 20, 3); ctx.fill();
    ctx.fillStyle = '#ffeb3b'; ctx.fillRect(-19, 38, 8, 4); ctx.fillRect(11, 38, 8, 4);
    ctx.fillStyle = '#ff5252'; ctx.fillRect(-19, -42, 8, 3); ctx.fillRect(11, -42, 8, 3);
  } else if (o.t === 'hole') {
    ctx.fillStyle = '#2b2b2b'; ctx.beginPath(); ctx.ellipse(0, 0, 17, 13, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#111'; ctx.beginPath(); ctx.ellipse(1, 2, 11, 8, 0, 0, 7); ctx.fill();
  } else if (o.t === 'puddle') {
    ctx.fillStyle = '#64b5f6'; ctx.globalAlpha = 0.8;
    ctx.beginPath(); ctx.ellipse(0, 0, 30, 17, 0, 0, 7); ctx.ellipse(-12, 6, 16, 10, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.globalAlpha = 0.5; ctx.beginPath(); ctx.ellipse(-8, -5, 8, 3, 0, 0, 7); ctx.fill();
  } else if (o.t === 'cone') {
    if (o.flung) ctx.rotate(o.y / 20);
    ctx.fillStyle = '#ff6d00'; ctx.beginPath(); ctx.moveTo(0, -14); ctx.lineTo(11, 11); ctx.lineTo(-11, 11); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillRect(-6, -1, 12, 4);
    ctx.fillStyle = '#e65100'; ctx.fillRect(-13, 10, 26, 4);
  } else if (o.t === 'coin') {
    const sx = Math.abs(Math.cos(o.spin || 0)) * 0.8 + 0.2;
    ctx.scale(sx, 1);
    ctx.fillStyle = '#f9a825'; ctx.beginPath(); ctx.arc(0, 0, 11, 0, 7); ctx.fill();
    ctx.fillStyle = '#ffd54f'; ctx.beginPath(); ctx.arc(0, 0, 8, 0, 7); ctx.fill();
    ctx.fillStyle = '#f9a825'; ctx.font = '12px Arial Black'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('€', 0, 1);
  } else if (o.t === 'bottle') {
    const pulse = 1 + Math.sin(performance.now() / 120) * 0.08;
    ctx.scale(pulse, pulse);
    ctx.fillStyle = 'rgba(79,195,247,.3)'; ctx.beginPath(); ctx.arc(0, 0, 20, 0, 7); ctx.fill();
    ctx.fillStyle = '#0288d1'; rr(-8, -10, 16, 24, 4); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillRect(-5, -15, 10, 6); ctx.fillRect(-8, 0, 16, 4);
  } else if (o.t === 'dog') {
    if (o.vx < 0) ctx.scale(-1, 1);
    const l = Math.sin(o.legs || 0) * 4;
    ctx.fillStyle = '#6d4c41';
    ctx.fillRect(-12 + l, 5, 4, 7); ctx.fillRect(6 - l, 5, 4, 7); ctx.fillRect(-12 - l, -12, 4, 7); ctx.fillRect(6 + l, -12, 4, 7);
    ctx.fillStyle = '#8d6e63'; rr(-15, -8, 30, 16, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(17, 0, 8, 0, 7); ctx.fill();
    ctx.fillStyle = '#4e342e'; ctx.fillRect(-20, -2, 7, 3);
    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(24, 0, 2.5, 0, 7); ctx.fill();
  } else if (o.t === 'bike') {
    drawRider(0, 0, o.col, '#333', Math.sin(o.wob) * 0.1, (o.wob || 0) * 3);
  }
  ctx.restore();
}

function drawRider(x, y, shirt, helmet, tilt, pedal) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(tilt);
  ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(4, 6, 10, 26, 0, 0, 7); ctx.fill();
  // wielen
  ctx.fillStyle = '#111'; rr(-3, -26, 6, 16, 3); ctx.fill(); rr(-3, 12, 6, 16, 3); ctx.fill();
  // stuur
  ctx.fillStyle = '#9e9e9e'; ctx.fillRect(-12, -14, 24, 3);
  // benen (trappen)
  const k = Math.sin(pedal) * 4;
  ctx.fillStyle = '#263238'; rr(-9, 2 + k, 6, 12, 3); ctx.fill(); rr(3, 2 - k, 6, 12, 3); ctx.fill();
  // lijf
  ctx.fillStyle = shirt; rr(-10, -10, 20, 20, 8); ctx.fill();
  // armen
  ctx.fillStyle = '#ffcc80'; ctx.fillRect(-12, -14, 4, 8); ctx.fillRect(8, -14, 4, 8);
  // helm
  ctx.fillStyle = helmet; ctx.beginPath(); ctx.ellipse(0, -6, 7, 8, 0, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.fillRect(-1, -13, 2, 12);
  ctx.restore();
}

function drawHUD() {
  ctx.fillStyle = 'rgba(0,0,0,.45)'; rr(8, 8, W - 16, 44, 12); ctx.fill();
  ctx.font = '20px Arial Black'; ctx.textBaseline = 'middle';
  ctx.textAlign = 'left'; ctx.fillStyle = '#fff';
  ctx.fillText(Math.floor(dist / 10) + ' m', 20, 31);
  ctx.textAlign = 'center'; ctx.fillStyle = '#ffd54f';
  ctx.fillText('€ ' + coins, W / 2, 31);
  ctx.textAlign = 'right'; ctx.fillStyle = '#ff5252';
  ctx.fillText('♥'.repeat(lives) + '♡'.repeat(3 - lives), W - 20, 31);
  // snelheidsmeter
  const kmh = Math.round(speed / 12);
  ctx.fillStyle = 'rgba(0,0,0,.45)'; rr(W - 98, H - 50, 88, 38, 10); ctx.fill();
  ctx.fillStyle = boost > 0 ? '#4fc3f7' : slow > 0 ? '#90caf9' : '#fff';
  ctx.font = '18px Arial Black'; ctx.textAlign = 'center';
  ctx.fillText(kmh + ' km/u', W - 54, H - 31);
}

function centerText(txt, y, size, col, stroke) {
  ctx.font = size + 'px Arial Black'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (stroke) { ctx.lineWidth = size / 6; ctx.strokeStyle = stroke; ctx.lineJoin = 'round'; ctx.strokeText(txt, W / 2, y); }
  ctx.fillStyle = col; ctx.fillText(txt, W / 2, y);
}

function drawMenu() {
  ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(0, 0, W, H);
  centerText('FIETS', 170, 72, '#ffd54f', '#000');
  centerText('RACE', 240, 72, '#fff', '#000');
  drawRider(W / 2, 340, '#e53935', '#fdd835', Math.sin(performance.now() / 300) * 0.2, performance.now() / 80);
  ctx.font = '16px Arial'; ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
  const lines = ['Ontwijk auto\'s, putten, pionnen en honden!', 'Pak muntjes € en de bidon voor TURBO.', 'Plassen maken je traag.', '', 'Pijltjes ← → of sleep met je vinger', 'B = fietsbel'];
  lines.forEach((l, i) => ctx.fillText(l, W / 2, 420 + i * 24));
  if (best) centerText('Record: ' + best, 590, 20, '#ffd54f');
  if (Math.floor(performance.now() / 500) % 2) centerText('TIK OM TE STARTEN', 640, 22, '#fff');
}

function drawOver() {
  ctx.fillStyle = 'rgba(0,0,0,.65)'; ctx.fillRect(0, 0, W, H);
  centerText('GEVALLEN!', 170, 52, '#ff5252', '#000');
  centerText(Math.floor(dist / 10) + ' meter', 260, 26, '#fff');
  centerText(coins + ' muntjes × 10', 300, 22, '#ffd54f');
  centerText('Score: ' + finalScore(), 370, 40, '#fff', '#000');
  if (newBest) centerText('NIEUW RECORD!', 430, 26, '#ffd54f', '#000');
  else centerText('Record: ' + best, 430, 20, '#ffd54f');
  if (performance.now() - overAt > 600 && Math.floor(performance.now() / 500) % 2) centerText('TIK OM OPNIEUW TE RIJDEN', 560, 20, '#fff');
}

function draw() {
  ctx.save();
  if (shake > 0) ctx.translate(rnd(-6, 6) * shake * 3, rnd(-6, 6) * shake * 3);
  drawRoad();
  if (scenery) scenery.forEach(drawScenery);
  if (objs) objs.forEach(drawObj);
  if (state !== 'menu') {
    if (boost > 0) {
      ctx.fillStyle = 'rgba(79,195,247,.35)';
      for (let i = 0; i < 5; i++) ctx.fillRect(p.x - 8 + rnd(-6, 6), p.y + 25 + i * 10, 3, rnd(10, 30));
      ctx.beginPath(); ctx.arc(p.x, p.y, 34, 0, 7); ctx.fill();
    }
    if (!(invul > 0 && Math.floor(invul * 10) % 2)) drawRider(p.x, p.y, '#e53935', '#fdd835', p.tilt, p.pedal);
    for (const q of popups) {
      ctx.globalAlpha = 1 - q.t / 0.9;
      ctx.font = '20px Arial Black'; ctx.textAlign = 'center'; ctx.lineWidth = 4; ctx.strokeStyle = '#000';
      ctx.strokeText(q.txt, q.x, q.y); ctx.fillStyle = q.col; ctx.fillText(q.txt, q.x, q.y);
      ctx.globalAlpha = 1;
    }
    drawHUD();
  }
  ctx.restore();
  if (state === 'menu') drawMenu();
  if (state === 'over') drawOver();
}

// ---------- lus ----------
reset();
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
